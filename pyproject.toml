[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-freddy"
version = "0.1.0"
description = "FRED data explorer MVP with Click and Textual"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "requests>=2.34.2",
    "textual>=8.2.7",
]

[project.scripts]
fred = "agent_freddy.cli:cli"
fred-tui = "agent_freddy.tui:run_from_env"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
